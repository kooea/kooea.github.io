    <!-- 结构化数据 -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "优学习",
            "description": "专业的学习资料生成平台，免费提供数学除法练习题生成工具，支持自定义题型、难度、数量，一键打印。",
            "applicationCategory": "EducationApplication",
            "operatingSystem": "Web",
            "url": "",
            "screenshot": "",
            "author": {
                "@type": "Organization",
                "name": "优学习"
            },
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "CNY"
            },
            "featureList": [
                "数学除法练习题生成",
                "自定义题型难度和数量",
                "一键打印学习资料"
            ]
        }
    </script>

    <script src="../js/navigation.js"></script>
    <script>
        let problemsCache = [];
        let selectedPages = 0;
        let savedDynamicTitle = '';
        let hasMultiStep = false;
        let needsWideGrid = false;
        let needsVerticalWideGrid = false;
        let needsRemainder = false;

        function updateQuantityLabel() {
            const problemMode = document.getElementById('problemMode').value;
            const problemType = document.getElementById('problemType').value;
            
            if (!problemType) {
                return;
            }
            
            let problemsPerPage;
            
            const digits = problemType.split('-').map(Number);
            
            if (problemMode === 'vertical') {
                if (digits[0] >= 4 || digits[1] >= 2) {
                    problemsPerPage = 12;
                } else if (digits[0] >= 3) {
                    problemsPerPage = 16;
                } else {
                    problemsPerPage = 28;
                }
            } else {
                if (digits[0] >= 3) {
                    problemsPerPage = 42;
                } else {
                    problemsPerPage = 60;
                }
            }
            
            const quantityLabel = document.getElementById('quantityLabel');
            quantityLabel.textContent = `题目页数（每页${problemsPerPage}题）`;
        }

        function formatDigits(num) {
            return num.toString().split('').map(d => `<span class="vert-digit">${d}</span>`).join('');
        }

        function formatBlanks(count) {
            return Array(count).fill('<span class="vert-digit">&nbsp;</span>').join('');
        }

        function generateProblems() {
            updateQuantityLabel();
            const problemMode = document.getElementById('problemMode').value;
            const problemType = document.getElementById('problemType').value;
            const pages = parseInt(document.getElementById('quantitySelect').value);
            
            if (!problemType) {
                alert('请选择题型构成');
                return;
            }
            
            const requireWholeEl = document.getElementById('requireWhole');
            const requireWhole = requireWholeEl ? requireWholeEl.value === 'true' : false;
            
            const defaultRanges = {
                '2-1': 100,
                '3-1': 1000,
                '3-2': 10000,
                '4-1': 10000,
                '4-2': 100000,
                '4-3': 100000
            };
            const range = defaultRanges[problemType] || 1000;
            
            hasMultiStep = false;
            needsWideGrid = false;
            needsVerticalWideGrid = false;
            needsRemainder = false;
            let problemsPerPage;
            
            if (problemMode === 'vertical') {
                const digits = problemType.split('-').map(Number);
                if (digits[0] >= 4 || digits[1] >= 2) {
                    hasMultiStep = true;
                    needsVerticalWideGrid = true;
                    problemsPerPage = 12;
                } else if (digits[0] >= 3) {
                    hasMultiStep = true;
                    needsVerticalWideGrid = false;
                    problemsPerPage = 16;
                } else {
                    hasMultiStep = false;
                    needsVerticalWideGrid = false;
                    problemsPerPage = 16;
                }
            } else {
                const digits = problemType.split('-').map(Number);
                if (digits[0] >= 3) {
                    needsWideGrid = true;
                    problemsPerPage = 42;
                } else {
                    needsWideGrid = false;
                    problemsPerPage = 60;
                }
            }
            
            const quantity = pages * problemsPerPage;
            selectedPages = pages;

            const missing = [];
            if (!problemType) missing.push('题型构成');
            if (!pages) missing.push('题目页数');

            if (missing.length > 0) {
                alert('请选择：' + missing.join('、'));
                return;
            }

            problemsCache = [];
            const digits = problemType.split('-').map(Number);
            const usedProblems = new Set();
            const generatedProblems = [];

            const getRandomByDigits = d => {
                if (d === 1) {
                    return Math.floor(Math.random() * 9) + 1;
                }
                const min = Math.pow(10, d - 1);
                const max = Math.pow(10, d) - 1;
                return Math.floor(Math.random() * (max - min + 1)) + min;
            };

            const validateDigits = (num, expectedDigits) => {
                const actualDigits = num.toString().length;
                return actualDigits === expectedDigits;
            };

            const getDigitCount = num => {
                return Math.max(num.toString().length, 2);
            };

            while (generatedProblems.length < quantity) {
                let dividend, divisor, quotient, remainder;
                let attempts = 0;
                const maxAttempts = 100;
                let isValid = false;
                let foundNew = false;

                while (!isValid && attempts < maxAttempts) {
                    divisor = getRandomByDigits(digits[1]);
                    const maxQuotient = Math.floor(range / divisor);
                    if (maxQuotient < 1) {
                        attempts++;
                        continue;
                    }
                    
                    const minQuotient = 1;
                    const maxQ = Math.min(maxQuotient, 999);
                    
                    quotient = Math.floor(Math.random() * (maxQ - minQuotient + 1)) + minQuotient;
                    
                    remainder = requireWhole ? 0 : Math.floor(Math.random() * divisor);
                    dividend = divisor * quotient + remainder;

                    isValid = validateDigits(dividend, digits[0]) &&
                             validateDigits(divisor, digits[1]);
                    attempts++;

                    if (isValid) {
                        const problemKey = `${dividend}-${divisor}`;
                        if (!usedProblems.has(problemKey)) {
                            usedProblems.add(problemKey);
                            generatedProblems.push({ dividend, divisor, quotient, remainder });
                            foundNew = true;
                            break;
                        }
                    }
                }

                if (!foundNew && generatedProblems.length > 0) {
                    const randomIndex = Math.floor(Math.random() * generatedProblems.length);
                    const randomProblem = generatedProblems[randomIndex];
                    generatedProblems.push({ ...randomProblem });
                }
            }

            for (const problem of generatedProblems) {
                const { dividend, divisor, quotient, remainder } = problem;
                const displayText = `${dividend} ÷ ${divisor} = `;
                let displayHTML = displayText;
                if (problemMode === 'vertical') {
                    const quotientDigits = quotient.toString().length;
                    
                    let verticalClass = ' vertical division-style' + (remainder > 0 ? ' with-remainder' : '');
                    
                    const dividendStr = formatDigits(dividend);
                    const divisorStr = formatDigits(divisor);
                    const quotientBlank = formatBlanks(quotientDigits);
                    const product = divisor * quotient;
                    const productStr = formatDigits(product);
                    
                    displayHTML = `
                        <div class="long-div-wrapper">
                            <div class="long-div-main">
                                <span class="long-div-divisor">${divisorStr}</span>
                                <svg class="long-div-svg" width="16" height="24" viewBox="0 0 16 24">
                                    <path d="M11 0 L11 16 Q11 23 2 23" stroke="#333" stroke-width="1" fill="none"/>
                                </svg>
                                <span class="long-div-dividend">${dividendStr}</span>
                            </div>
                            <div class="long-div-blank-space"></div>
                            <div class="long-div-blank-space"></div>
                            <div class="long-div-blank-space"></div>
                        </div>
                    `;
                    
                    problemsCache.push({
                        dividend,
                        divisor,
                        quotient,
                        remainder,
                        displayText,
                        displayHTML,
                        digitCount: getDigitCount(dividend),
                        hasRemainder: remainder > 0,
                        verticalClass: verticalClass
                    });
                    continue;
                }
                problemsCache.push({
                    dividend,
                    divisor,
                    quotient,
                    remainder,
                    displayText,
                    displayHTML,
                    digitCount: getDigitCount(dividend),
                    hasRemainder: remainder > 0
                });
            }

            const container = document.getElementById('paperContainer');
            const totalPages = Math.ceil(problemsCache.length / problemsPerPage);

            const now = new Date();
            const baseId = now.getFullYear().toString().slice(-2) +
                        String(now.getMonth() + 1).padStart(2, '0') +
                        String(now.getDate()).padStart(2, '0') +
                        String(now.getHours()).padStart(2, '0') +
                        String(now.getMinutes()).padStart(2, '0') +
                        String(now.getSeconds()).padStart(2, '0');

            const problemTypeText = document.getElementById('problemType').options[document.getElementById('problemType').selectedIndex].text;
            const problemModeText = document.getElementById('problemMode').options[document.getElementById('problemMode').selectedIndex].text;
            const requireWholeText = requireWhole ? '整除' : '';
            const dynamicTitle = requireWholeText 
                ? `${problemTypeText} 除法 ${problemModeText} (${requireWholeText})`
                : `${problemTypeText} 除法 ${problemModeText}`;
            savedDynamicTitle = dynamicTitle;

            container.innerHTML = '';

            for (let page = 0; page < totalPages; page++) {
                const pagePaper = document.createElement('div');
                pagePaper.className = 'paper-preview';
                const pageUniqueId = `${baseId}${page + 1}`;
                const pageTitle = problemMode === 'fill' ? '填空题' : (problemMode === 'vertical' ? '竖式运算' : '运算题');
                const verticalGridClass = problemMode === 'vertical' ? ' vertical-grid' : '';
                pagePaper.innerHTML = `
                    <div class="paper-title" id="paperTitle">${dynamicTitle}</div>
                    <div class="paper-info">
                        <span class="info-name">姓名: ____________</span>
                        <span class="info-class">班级: ____________</span>
                        <span class="info-date">日期: ____________</span>
                    </div>
                    <div class="problems-grid${verticalGridClass}${needsWideGrid ? ' wide-grid' : ''}${needsVerticalWideGrid ? ' vertical-wide-grid' : ''}">
                        ${problemsCache.slice(page * problemsPerPage, (page + 1) * problemsPerPage).map(p => {
                            if (problemMode === 'fill') {
                                const hideDividend = Math.random() < 0.33;
                                const hideDivisor = !hideDividend && Math.random() < 0.5;
                                if (hideDividend) {
                                    return `<div class="problem-item"><span class="underline"></span> ÷ ${p.divisor} = ${p.quotient}${p.hasRemainder ? '...' + p.remainder : ''}</div>`;
                                } else if (hideDivisor) {
                                    return `<div class="problem-item">${p.dividend} ÷ <span class="underline"></span> = ${p.quotient}${p.hasRemainder ? '...' + p.remainder : ''}</div>`;
                                } else {
                                    return `<div class="problem-item">${p.dividend} ÷ ${p.divisor} = <span class="underline"></span></div>`;
                                }
                            } else if (problemMode === 'vertical') {
                                return `<div class="problem-item${p.verticalClass}">${p.displayHTML}</div>`;
                            } else {
                                return `<div class="problem-item">${p.dividend} ÷ ${p.divisor} = </div>`;
                            }
                        }).join('')}
                    </div>
                    <div class="paper-footer">
                        <span class="website-url">© 优学习 www.youxuexi.com</span>
                        <span class="page-number">第 ${page + 1} 页</span>
                        <span class="unique-id">编号: ${pageUniqueId}</span>
                    </div>
                `;
                container.appendChild(pagePaper);
            }
        }

        function printPaper() {
            window.print();
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        window.addEventListener('scroll', function() {
            const backToTopBtn = document.getElementById('backToTop');
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        function positionBackToTopBtn() {
            const configSection = document.querySelector('.config-section');
            const backToTopBtn = document.getElementById('backToTop');
            
            if (configSection && backToTopBtn) {
                const rect = configSection.getBoundingClientRect();
                backToTopBtn.style.left = rect.left + 'px';
            }
        }

        window.addEventListener('load', positionBackToTopBtn);
        window.addEventListener('resize', positionBackToTopBtn);
        window.addEventListener('load', updateQuantityLabel);

        document.addEventListener('DOMContentLoaded', function() {
            const yearSpan = document.getElementById('currentYear');
            if (yearSpan) {
                yearSpan.textContent = new Date().getFullYear();
            }
        });

        function toggleMobileMenu() {
            const nav = document.getElementById('mainNav');
            nav.classList.toggle('active');
        }
    </script>
