        </svg>
    </button>

    <!-- 结构化数据 -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "优学习",
        "description": "专业的学习资料生成平台，免费提供数学综合运算练习题生成工具，支持自定义题型、难度、数量，一键打印。",
        "applicationCategory": "EducationApplication",
        "operatingSystem": "Web",
        "url": "",
        "screenshot": "",
        "author": {
            "@type": "Organization",
            "name": "优学习"
        },
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "CNY"
        },
        "featureList": [
            "数学综合运算练习题生成",
            "自定义题型难度和数量",
            "一键打印学习资料",
            "语文拼音练习",
            "英语单词练习"
        ]
    }
    </script>

    <script src="../js/navigation.js"></script>
    <script>
        function toggleMobileMenu() {
            const nav = document.getElementById('mainNav');
            nav.classList.toggle('active');
        }

        function showModule(module) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');

            const titles = {
                'addition': '加法练习题',
                'multiplication': '乘法练习题',
                'division': '除法练习题',
                'mixed': '综合运算练习题'
            };

            document.getElementById('paperTitle').textContent = titles[module] || '练习题';
            generateProblems();
        }

        function updateRangeOptions(autoSelectFirst = false) {
            const problemType = document.getElementById('problemType').value;
            const rangeSelect = document.getElementById('rangeSelect');
            rangeSelect.innerHTML = '<option value="">请选择</option>';

            if (!problemType) return;

            const ranges = {
                '1-1': [{value: '9', text: '9以内'}, {value: '18', text: '18以内'}],
                '1-2': [{value: '20', text: '20以内'}, {value: '100', text: '100以内'}],
                '2-1': [{value: '99', text: '99以内'}, {value: '100', text: '100以内'}],
                '2-2': [{value: '100', text: '100以内'}, {value: '198', text: '198以内'}],
                '2-3': [{value: '1000', text: '1000以内'}],
                '3-2': [{value: '1000', text: '1000以内'}],
                '3-3': [{value: '1000', text: '1000以内'}, {value: '1998', text: '1998以内'}]
            };

            if (ranges[problemType]) {
                let firstValue = '';
                ranges[problemType].forEach((item) => {
                    const option = document.createElement('option');
                    option.value = item.value;
                    option.textContent = item.text;
                    if (!firstValue) firstValue = item.value;
                    rangeSelect.appendChild(option);
                });
                if (autoSelectFirst && firstValue) {
                    rangeSelect.value = firstValue;
                }
            }
        }

        function updateQuantityLabel() {
            const problemsPerPage = 60;
            const quantityLabel = document.getElementById('quantityLabel');
            quantityLabel.textContent = `题目页数（每页${problemsPerPage}题）`;
        }

        let problemsCache = [];
        let selectedPages = 0;
        let savedDynamicTitle = '';

        function formatDigits(num) {
            return num.toString().split('').map(d => `<span class="vert-digit">${d}</span>`).join('');
        }

        function formatBlanks(count) {
            return Array(count).fill('<span class="vert-digit">&nbsp;</span>').join('');
        }

        function generateProblems() {
            const grade = document.getElementById('gradeSelect').value;
            const pages = parseInt(document.getElementById('quantitySelect').value);

            if (!pages) {
                alert('请选择题目页数');
                return;
            }

            const problemsPerPage = 60;
            const quantity = pages * problemsPerPage;
            selectedPages = pages;

            const gradeNames = { '1': '一年级', '2': '二年级', '3': '三年级', '4': '四年级' };
            savedDynamicTitle = `${gradeNames[grade]}综合运算练习题`;

            problemsCache = [];
            const usedProblems = new Set();

            for (let i = 0; i < quantity; i++) {
                let attempts = 0;
                const maxAttempts = 100;
                let problem = null;

                while (!problem && attempts < maxAttempts) {
                    const type = Math.random();
                    let num1, num2, num3, result, displayText;

                    switch (grade) {
                        case '1':
                            num1 = Math.floor(Math.random() * 9) + 1;
                            num2 = Math.floor(Math.random() * 9) + 1;
                            num3 = Math.floor(Math.random() * 9) + 1;
                            if (type < 0.5) {
                                result = num1 + num2;
                                const step1 = num1 + num2;
                                const final = step1 - num3;
                                if (final >= 0 && final <= 20) {
                                    const key = `${num1}+${num2}-${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = { num1, num2, num3, operators: '+-', result: final, displayText: `${num1} + ${num2} - ${num3} = ` };
                                    }
                                }
                            } else {
                                result = num1 - num2;
                                const step1 = num1 - num2;
                                const final = step1 + num3;
                                if (step1 >= 0 && final <= 20) {
                                    const key = `${num1}-${num2}+${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = { num1, num2, num3, operators: '-+', result: final, displayText: `${num1} - ${num2} + ${num3} = ` };
                                    }
                                }
                            }
                            break;

                        case '2':
                            num1 = Math.floor(Math.random() * 50) + 10;
                            num2 = Math.floor(Math.random() * 40) + 10;
                            num3 = Math.floor(Math.random() * 50) + 10;
                            if (type < 0.5) {
                                const final = num1 + num2 - num3;
                                if (final >= 10 && final <= 99) {
                                    const key = `${num1}+${num2}-${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = { num1, num2, num3, operators: '+-', result: final, displayText: `${num1} + ${num2} - ${num3} = ` };
                                    }
                                }
                            } else {
                                const final = num1 - num2 + num3;
                                if (final >= 10 && final <= 99) {
                                    const key = `${num1}-${num2}+${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = { num1, num2, num3, operators: '-+', result: final, displayText: `${num1} - ${num2} + ${num3} = ` };
                                    }
                                }
                            }
                            break;

                        case '3':
                            num1 = Math.floor(Math.random() * 5) + 2;
                            num2 = Math.floor(Math.random() * 5) + 2;
                            num3 = Math.floor(Math.random() * 20) + 10;
                            const mult = num1 * num2;
                            const multFirst = Math.random() < 0.5;
                            
                            if (multFirst) {
                                if (type < 0.5) {
                                    const final = mult + num3;
                                    const key = `${num1}*${num2}+${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = { num1, num2, num3, operators: '*-', result: final, displayText: `${num1} × ${num2} + ${num3} = ` };
                                    }
                                } else {
                                    const final = mult - num3;
                                    if (final > 0) {
                                        const key = `${num1}*${num2}-${num3}`;
                                        if (!usedProblems.has(key)) {
                                            usedProblems.add(key);
                                            problem = { num1, num2, num3, operators: '*-', result: final, displayText: `${num1} × ${num2} - ${num3} = ` };
                                        }
                                    }
                                }
                            } else {
                                if (type < 0.5) {
                                    const final = num3 + mult;
                                    const key = `${num3}+${num1}*${num2}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = { num1, num2, num3, operators: '+*', result: final, displayText: `${num3} + ${num1} × ${num2} = ` };
                                    }
                                } else {
                                    const final = num3 - mult;
                                    if (final > 0) {
                                        const key = `${num3}-${num1}*${num2}`;
                                        if (!usedProblems.has(key)) {
                                            usedProblems.add(key);
                                            problem = { num1, num2, num3, operators: '-*', result: final, displayText: `${num3} - ${num1} × ${num2} = ` };
                                        }
                                    }
                                }
                            }
                            break;

                        case '4':
                            const grade4Type = Math.floor(Math.random() * 8);
                            
                            if (grade4Type === 0) {
                                const divisor = Math.floor(Math.random() * 8) + 2;
                                const quotient = Math.floor(Math.random() * 10) + 5;
                                const parenNum1 = divisor * quotient;
                                const parenNum2 = Math.floor(Math.random() * Math.max(parenNum1 - 2, 1)) + 1;
                                const parenResult = parenNum1 - parenNum2;
                                
                                if (parenResult >= 1 && parenNum2 >= 1 && parenResult >= divisor) {
                                    const key = `4_0_${divisor}/${parenNum1}-${parenNum2}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `${divisor} ÷ (${parenNum1} - ${parenNum2}) = `
                                        };
                                    }
                                }
                            } else if (grade4Type === 1) {
                                const divisor = Math.floor(Math.random() * 6) + 4;
                                const num1 = Math.floor(Math.random() * 8) + 3;
                                const num2 = Math.floor(Math.random() * 8) + 3;
                                const parenSum = num1 + num2;
                                
                                if (parenSum > divisor && parenSum % divisor === 0) {
                                    const key = `4_1_${divisor}/${num1}+${num2}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `${divisor} ÷ (${num1} + ${num2}) = `
                                        };
                                    }
                                }
                            } else if (grade4Type === 2) {
                                const multiplier = Math.floor(Math.random() * 8) + 5;
                                const num1 = Math.floor(Math.random() * 8) + 3;
                                const num2 = Math.floor(Math.random() * 8) + 3;
                                const parenSum = num1 + num2;
                                
                                if (parenSum * multiplier <= 200) {
                                    const key = `4_2_${num1}+${num2}*${multiplier}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `(${num1} + ${num2}) × ${multiplier} = `
                                        };
                                    }
                                }
                            } else if (grade4Type === 3) {
                                const divisor = Math.floor(Math.random() * 8) + 4;
                                const num1 = Math.floor(Math.random() * 8) + 3;
                                const num2 = Math.floor(Math.random() * 8) + 3;
                                const parenSum = num1 + num2;
                                
                                if (parenSum % divisor === 0 && parenSum / divisor >= 2) {
                                    const key = `4_3_${num1}+${num2}/${divisor}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `(${num1} + ${num2}) ÷ ${divisor} = `
                                        };
                                    }
                                }
                            } else if (grade4Type === 4) {
                                const dividend = Math.floor(Math.random() * 50) + 50;
                                const divisor = Math.floor(Math.random() * 8) + 4;
                                
                                if (dividend % divisor === 0 && dividend / divisor >= 10) {
                                    const key = `4_4_${dividend}/${divisor}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `${dividend} ÷ ${divisor} = `
                                        };
                                    }
                                }
                            } else if (grade4Type === 5) {
                                const num1 = Math.floor(Math.random() * 20) + 30;
                                const num2 = Math.floor(Math.random() * 20) + 30;
                                const num3 = Math.floor(Math.random() * 20) + 30;
                                const result = num1 + num2 - num3;
                                
                                if (result >= 10) {
                                    const key = `4_5_${num1}+${num2}-${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `${num1} + ${num2} - ${num3} = `
                                        };
                                    }
                                }
                            } else if (grade4Type === 6) {
                                const num1 = Math.floor(Math.random() * 15) + 10;
                                const num2 = Math.floor(Math.random() * 15) + 10;
                                const num3 = Math.floor(Math.random() * 15) + 10;
                                const result = num1 * num2 + num3;
                                
                                if (result <= 300) {
                                    const key = `4_6_${num1}*${num2}+${num3}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `${num1} × ${num2} + ${num3} = `
                                        };
                                    }
                                }
                            } else {
                                const mult1 = Math.floor(Math.random() * 12) + 8;
                                const mult2 = Math.floor(Math.random() * 9) + 2;
                                const mult3 = Math.floor(Math.random() * 12) + 8;
                                const mult4 = Math.floor(Math.random() * 9) + 2;
                                const result = mult1 * mult2 + mult3 * mult4;
                                
                                if (result <= 500) {
                                    const key = `4_7_${mult1}*${mult2}+${mult3}*${mult4}`;
                                    if (!usedProblems.has(key)) {
                                        usedProblems.add(key);
                                        problem = {
                                            displayText: `${mult1} × ${mult2} + ${mult3} × ${mult4} = `
                                        };
                                    }
                                }
                            }
                            break;
                    }
                    attempts++;
                }

                if (problem) {
                    problemsCache.push(problem);
                }
            }

            const container = document.getElementById('paperContainer');
            const totalPages = pages;

            const now = new Date();
            const baseId = now.getFullYear().toString().slice(-2) +
                          String(now.getMonth() + 1).padStart(2, '0') +
                          String(now.getDate()).padStart(2, '0') +
                          String(now.getHours()).padStart(2, '0') +
                          String(now.getMinutes()).padStart(2, '0') +
                          String(now.getSeconds()).padStart(2, '0');

            container.innerHTML = '';

            for (let page = 0; page < totalPages; page++) {
                const pagePaper = document.createElement('div');
                pagePaper.className = 'paper-preview';
                const pageUniqueId = `${baseId}${page + 1}`;

                const start = page * problemsPerPage;
                const end = start + problemsPerPage;
                const pageProblems = problemsCache.slice(start, end);

                pagePaper.innerHTML = `
                    <div class="paper-title">${savedDynamicTitle}</div>
                    <div class="paper-info">
                        <span class="info-name">姓名: ____________</span>
                        <span class="info-class">班级: ____________</span>
                        <span class="info-date">日期: ____________</span>
                    </div>
                    <div class="problems-grid">
                        ${pageProblems.map(p => `<div class="problem-item">${p.displayText}</div>`).join('')}
                    </div>
                    <div class="paper-footer">
                        <span class="website-url">© 优学习 www.youxuexi.com</span>
                        <span class="page-number">第 ${page + 1} 页</span>
                        <span class="unique-id">编号: ${pageUniqueId}</span>
                    </div>
                `;
                container.appendChild(pagePaper);
            }
        }

        function refreshDisplay() {
            if (problemsCache.length === 0) return;

            const problemMode = document.getElementById('problemMode').value;
            const container = document.getElementById('paperContainer');
            const problemsPerPage = problemMode === 'vertical' ? 28 : 60;
            const totalPages = selectedPages;
            const displayQuantity = totalPages * problemsPerPage;
            const displayProblems = problemsCache.slice(0, displayQuantity);

            container.innerHTML = '';

            for (let page = 0; page < totalPages; page++) {
                const pagePaper = document.createElement('div');
                pagePaper.className = 'paper-preview';
                const verticalClass = problemMode === 'vertical' ? ' vertical' : '';
                const verticalGridClass = problemMode === 'vertical' ? ' vertical-grid' : '';

                const pageProblems = displayProblems.slice(page * problemsPerPage, (page + 1) * problemsPerPage);
                let itemsHTML = '';

                if (problemMode === 'fill') {
                    pageProblems.forEach(problem => {
                        const hideFirst = Math.random() < 0.5;
                        if (problem.operator === '+') {
                            if (hideFirst) {
                                itemsHTML += `<div class="problem-item"><span class="underline"></span> + ${problem.num2} = ${problem.result}</div>`;
                            } else {
                                itemsHTML += `<div class="problem-item">${problem.num1} + <span class="underline"></span> = ${problem.result}</div>`;
                            }
                        } else {
                            if (hideFirst) {
                                itemsHTML += `<div class="problem-item"><span class="underline"></span> - ${problem.num2} = ${problem.result}</div>`;
                            } else {
                                itemsHTML += `<div class="problem-item">${problem.num1} - <span class="underline"></span> = ${problem.result}</div>`;
                            }
                        }
                    });
                } else if (problemMode === 'vertical') {
                    pageProblems.forEach(problem => {
                        const opSymbol = problem.operator === '+' ? '+' : '-';
                        const num1Digits = problem.num1.toString().length;
                        const num2Digits = problem.num2.toString().length;
                        const underscoreCount = problem.digitCount + 1;
                        const spacerCount = num1Digits - num2Digits;
                        let spacer = '';
                        for (let i = 0; i < spacerCount; i++) {
                            spacer += '<span class="vert-digit">&nbsp;</span>';
                        }
                        itemsHTML += `
                            <div class="problem-item vertical">
                                <div class="vert-num1">${formatDigits(problem.num1)}</div>
                                <div class="vert-num2"><span class="vert-op">${opSymbol}</span>${spacer}${formatDigits(problem.num2)}</div>
                                <div class="vert-line"></div>
                                <div class="vert-result">${formatBlanks(underscoreCount)}</div>
                            </div>`;
                    });
                } else {
                    pageProblems.forEach(problem => {
                        itemsHTML += `<div class="problem-item">${problem.num1} ${problem.operator} ${problem.num2} = </div>`;
                    });
                }

                pagePaper.innerHTML = `
                    <div class="paper-title">${savedDynamicTitle}</div>
                    <div class="paper-info">
                        <span class="info-name">姓名: ____________</span>
                        <span class="info-class">班级: ____________</span>
                        <span class="info-date">日期: ____________</span>
                    </div>
                    <div class="problems-grid${verticalGridClass}">${itemsHTML}</div>
                    <div class="paper-footer">
                        <span class="website-url">© 优学习 www.youxuexi.com</span>
                        <span class="page-number">第 ${page + 1} 页</span>
                        <span class="unique-id">编号: ${Date.now().toString().slice(-8)}</span>
                    </div>
                `;
                container.appendChild(pagePaper);
            }
        }

        function printPaper() {
            window.print();
        }

        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // 监听滚动事件，显示/隐藏回到顶部按钮
        window.addEventListener('scroll', function() {
            const backToTopBtn = document.getElementById('backToTop');
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        // 动态定位回到顶部按钮，与config-section左边对齐
        function positionBackToTopBtn() {
            const configSection = document.querySelector('.config-section');
            const backToTopBtn = document.getElementById('backToTop');
            
            if (configSection && backToTopBtn) {
                const rect = configSection.getBoundingClientRect();
                backToTopBtn.style.left = rect.left + 'px';
            }
        }

        // 页面加载时和窗口大小改变时重新定位
        window.addEventListener('load', positionBackToTopBtn);
        window.addEventListener('resize', positionBackToTopBtn);
        window.addEventListener('load', updateQuantityLabel);

        // 自动更新版权年份
        document.addEventListener('DOMContentLoaded', function() {
            const yearSpan = document.getElementById('current-year');
            if (yearSpan) {
                yearSpan.textContent = new Date().getFullYear();
            }
        });
    </script>
